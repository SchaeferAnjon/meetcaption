<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>界面组件</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* 只给组件页用的排版 */
      .sg-page {
        padding: 8px 32px 64px;
        max-width: 980px;
      }
      .sg-section {
        padding: 28px 0 8px;
        border-top: 1px solid var(--stroke);
      }
      .sg-section:first-child {
        border-top: 0;
        padding-top: 12px;
      }
      .sg-section > h2 {
        margin: 0 0 4px;
        font-size: var(--fs-lg);
        font-weight: var(--fw-semibold);
      }
      .sg-section > .sg-lead {
        margin: 0 0 16px;
        color: var(--text-2);
      }
      .sg-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .sg-label {
        width: 100%;
        color: var(--text-3);
        font-size: var(--fs-xs);
        font-weight: var(--fw-semibold);
        margin-bottom: -2px;
      }
      .sg-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px 24px;
      }
      .sg-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .sg-swatches {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      .sg-swatch {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .sg-chip {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        box-shadow: inset 0 0 0 1px var(--stroke);
        background: var(--bg);
      }
      .sg-chip > i {
        box-shadow: inset 0 0 0 1px var(--stroke);
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }
      .sg-swatch code {
        font-family: var(--font-mono);
        font-size: var(--fs-xs);
        color: var(--text-2);
      }
      .sg-panel {
        border: 1px solid var(--stroke);
        border-radius: var(--r-lg);
        padding-top: 8px;
        padding-bottom: 8px;
        background: var(--bg);
      }
      .sg-static {
        position: static !important;
        animation: none !important;
      }
      .sg-box > .toast {
        align-self: flex-start;
      }
      .sg-hud-stage {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: start;
        gap: 16px;
        padding: 20px;
        border-radius: var(--r-xl);
        background:
          radial-gradient(120% 90% at 10% 0%, #3b4fd8 0%, transparent 55%),
          radial-gradient(120% 90% at 100% 100%, #1f7a78 0%, transparent 55%),
          #20242e;
      }
      .sg-caption {
        padding: 12px 16px;
        font-size: 18px;
        line-height: 1.45;
      }
      .sg-caption .who {
        color: var(--text-3);
        font-size: var(--fs-xs);
        font-weight: var(--fw-semibold);
        margin-right: 6px;
      }
      .sg-caption .tr {
        color: var(--tr);
        font-size: 15px;
      }
      .sg-caption .me {
        color: var(--text-2);
        font-size: 15px;
      }
      .sg-answer {
        display: flex;
        flex-direction: column;
      }
      .sg-answer-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px 14px;
        line-height: 1.5;
      }
      .sg-answer-q {
        color: var(--text-2);
        font-size: var(--fs-sm);
      }
      .sg-answer-key {
        color: var(--accent-text);
        font-weight: var(--fw-semibold);
      }
      .sg-answer-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 8px 14px;
        color: var(--text-3);
        font-size: var(--fs-xs);
      }
      .sg-answer-foot .spacer {
        flex: 1;
      }

      /* 骨架页 */
      .sk-detail {
        padding: 20px 28px 32px;
        max-width: 820px;
      }
      .sk-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 8px 0 18px;
        color: var(--text-2);
        font-size: var(--fs-sm);
      }
      .sk-meta .icon {
        width: 14px;
        height: 14px;
        color: var(--text-3);
      }
      .sk-todos {
        display: flex;
        flex-direction: column;
        margin: 4px 0 20px;
      }
      .sk-todo {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        padding: 0 8px;
        margin: 0 -8px;
        border-radius: var(--r-md);
      }
      .sk-todo:hover {
        background: var(--fill-1);
      }
      .sk-todo .todo-text {
        flex: 1;
        min-width: 0;
      }
      .sk-todo.is-done .todo-text {
        color: var(--text-3);
        text-decoration: line-through;
      }
      .sk-start {
        padding: 10px 12px 6px;
      }
      .sk-list-tabs {
        padding: 8px 12px 4px;
      }
      .main-bar {
        justify-content: flex-end;
        gap: 10px;
      }
      .main-bar .title-lg {
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="app-sidebar" id="sidebar"></aside>
      <main class="app-main" id="main"></main>
    </div>
    <script src="icons.js"></script>
    <script src="ui.js"></script>
    <script src="styleguide.js"></script>
  </body>
</html>
